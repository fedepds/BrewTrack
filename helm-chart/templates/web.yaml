apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "brewtrack.labels" (list . "web") | nindent 4 }}
spec:
  selector:
    {{- include "brewtrack.selector" (list . "web") | nindent 4 }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "brewtrack.labels" (list . "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "brewtrack.selector" (list . "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "brewtrack.labels" (list . "web") | nindent 8 }}
    spec:
      # uid 101 = usuario nginx de la imagen alpine.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      volumes:
        - name: conf
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          # Raíz de solo lectura: nginx escribe la config generada, la caché y el pid aquí.
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
          env:
            # Nombre completo del Service api: el resolver de nginx no completa nombres cortos.
            - name: API_UPSTREAM
              value: http://{{ .Release.Name }}-api.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.api.service.port }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
