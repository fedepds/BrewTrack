# helm test: un GET a /api/v1/health a través de web prueba web, el proxy y api.
# Usa la imagen de api porque ya trae python.
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-health
  labels:
    {{- include "brewtrack.labels" (list . "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: health
      image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
      imagePullPolicy: {{ .Values.api.image.pullPolicy }}
      {{- with .Values.tests.resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      # Justo después de un rollout, el pedido puede ir al pod viejo de api mientras se apaga:
      # reintenta hasta 6 veces, con 5 s entre intentos. El último error sale con 1.
      command:
        - python
        - -c
        - |
          import time, urllib.request
          for i in range(6):
              try:
                  r = urllib.request.urlopen("http://{{ .Release.Name }}-web:{{ .Values.web.service.port }}/api/v1/health", timeout=10)
                  print(r.status, r.read().decode())
                  raise SystemExit(0)
              except OSError as e:
                  print("intento", i + 1, "falló:", e)
                  if i == 5:
                      raise
                  time.sleep(5)
