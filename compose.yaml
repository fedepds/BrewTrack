services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: brewtrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: brewtrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewtrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: brewtrack-api.Containerfile
    image: localhost/brewtrack-api:0.2.0
    environment:
      DATABASE_URL: postgresql+psycopg://brewtrack:${POSTGRES_PASSWORD}@db:5432/brewtrack
      JWT_SECRET: ${JWT_SECRET}
      TIMEZONE: ${TIMEZONE:-America/Argentina/Buenos_Aires}
      SEED_DEMO_LOTS: ${SEED_DEMO_LOTS:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
      dockerfile: brewtrack-web.Containerfile
    image: localhost/brewtrack-web:0.1.1
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: docker.io/prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      - api

  grafana:
    image: docker.io/grafana/grafana:12.2.0
    # Sin GRAFANA_ADMIN_PASSWORD no arranca: así no queda la contraseña por defecto (RF-17).
    entrypoint:
      - sh
      - -c
      - '[ -n "$$GF_SECURITY_ADMIN_PASSWORD" ] || { echo "Falta GRAFANA_ADMIN_PASSWORD en .env" >&2; exit 1; }; exec /run.sh'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  promdata:
  grafanadata:
