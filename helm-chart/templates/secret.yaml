{{- if not .Values.existingSecret }}
# Claves al azar solo en la primera instalación; en upgrade se reusan las del Secret vivo.
{{- $name := include "brewtrack.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "brewtrack.labels" (list . "secrets") | nindent 4 }}
  annotations:
    # helm uninstall no lo borra: el volumen de la base sigue esperando esta contraseña.
    helm.sh/resource-policy: keep
type: Opaque
data:
  POSTGRES_PASSWORD: {{ $old.POSTGRES_PASSWORD | default (randAlphaNum 32 | b64enc) | quote }}
  JWT_SECRET: {{ $old.JWT_SECRET | default (randAlphaNum 64 | b64enc) | quote }}
{{- end }}
