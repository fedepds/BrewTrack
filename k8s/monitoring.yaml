# Prometheus y Grafana en Minikube. La configuración vive en monitoring/ y entra por ConfigMaps
# que se crean con kubectl (ver k8s/README.md). La contraseña de Grafana viene del Secret brewtrack-secrets.
# Los datos viven en emptyDir: al borrar el Pod se pierde el historial (RF-24b).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: brewtrack
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v3.5.0
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
            periodSeconds: 5
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: brewtrack
spec:
  selector: {app: prometheus}
  ports:
    - {port: 9090, targetPort: 9090}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: brewtrack
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:12.2.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: brewtrack-secrets, key: GRAFANA_ADMIN_PASSWORD}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 5
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: dashboards, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: alerting, mountPath: /etc/grafana/provisioning/alerting}
            - {name: data, mountPath: /var/lib/grafana}
      volumes:
        - name: datasources
          configMap: {name: grafana-datasources}
        - name: dashboards
          configMap: {name: grafana-dashboards}
        - name: alerting
          configMap: {name: grafana-alerting}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: brewtrack
spec:
  selector: {app: grafana}
  ports:
    - {port: 3000, targetPort: 3000}
