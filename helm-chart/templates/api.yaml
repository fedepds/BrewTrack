apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "brewtrack.labels" (list . "api") | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "brewtrack.selector" (list . "api") | nindent 4 }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "brewtrack.labels" (list . "api") | nindent 4 }}
spec:
  # ponytail: ignora api.replicas; con más, cada una corre "alembic upgrade head" al arrancar. Pasar las migraciones a un Job antes de escalar.
  replicas: 1  # fija por las migraciones al arrancar
  selector:
    matchLabels:
      {{- include "brewtrack.selector" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "brewtrack.labels" (list . "api") | nindent 8 }}
      # Cambia si cambia el ConfigMap: helm upgrade reinicia el pod.
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # uid numérico: con "USER app" el kubelet no puede comprobar runAsNonRoot.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: POSTGRES_PASSWORD
            # $(VAR) usa una variable definida más arriba en esta lista.
            - name: DATABASE_URL
              value: postgresql+psycopg://brewtrack:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-db:{{ .Values.db.service.port }}/brewtrack
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: JWT_SECRET
          ports:
            - containerPort: 8000
          # Si db no está lista, la API falla y Kubernetes la reinicia hasta que conecta.
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
