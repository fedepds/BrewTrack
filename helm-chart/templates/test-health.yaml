# helm test: un GET a /api/v1/health a través de web prueba web, el proxy y api.
# Usa la imagen de api porque ya trae python.
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-health
  labels:
    {{- include "brewtrack.labels" (list . "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: health
      image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
      imagePullPolicy: {{ .Values.api.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
      # urlopen lanza una excepción, y python sale con 1, si la respuesta no es 2xx.
      command:
        - python
        - -c
        - |
          import urllib.request
          r = urllib.request.urlopen("http://{{ .Release.Name }}-web:{{ .Values.web.service.port }}/api/v1/health", timeout=10)
          print(r.status, r.read().decode())
          raise SystemExit(0 if r.status == 200 else 1)
