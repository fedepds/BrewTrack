services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: brewtrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: brewtrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewtrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: brewtrack-api.Containerfile
    image: localhost/brewtrack-api:0.1.0
    environment:
      DATABASE_URL: postgresql+psycopg://brewtrack:${POSTGRES_PASSWORD}@db:5432/brewtrack
      JWT_SECRET: ${JWT_SECRET}
      TIMEZONE: ${TIMEZONE:-America/Argentina/Buenos_Aires}
      SEED_DEMO_LOTS: ${SEED_DEMO_LOTS:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
      dockerfile: brewtrack-web.Containerfile
    image: localhost/brewtrack-web:0.1.1
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
