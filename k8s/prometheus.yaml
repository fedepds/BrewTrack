# Prometheus para BrewTrack. Lee dos fuentes:
# - job "api": /metrics de cada pod de la API, descubiertos por el Service de la chart (etiqueta
#   app.kubernetes.io/component=api, sea cual sea el nombre del release). Métricas HTTP y de negocio.
# - job "kubernetes-cadvisor": CPU y memoria de cada contenedor, que publica el kubelet de cada nodo.
# Necesita permisos de lectura sobre el clúster: ServiceAccount + ClusterRole abajo.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: brewtrack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: brewtrack-prometheus
rules:
  # Descubrir nodos, Services y pods.
  - apiGroups: [""]
    resources: [nodes, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  # Leer /metrics/cadvisor del kubelet a través del API server.
  - apiGroups: [""]
    resources: [nodes/proxy, nodes/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: brewtrack-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: brewtrack-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: brewtrack
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: brewtrack
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      # Cada pod detrás del Service de la API, con su nombre en la etiqueta "pod". Sirve con 1 réplica o con varias.
      - job_name: api
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [brewtrack]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
            regex: api
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

      # cAdvisor de cada nodo, pedido al API server (no hace falta llegar al kubelet directo).
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
        # Solo los contenedores de BrewTrack: el resto del clúster no aporta al dashboard y llena el disco.
        metric_relabel_configs:
          - source_labels: [namespace]
            regex: brewtrack
            action: keep
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: brewtrack
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: brewtrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      # El token de la ServiceAccount es lo que autoriza la lectura del clúster.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v3.15.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus
        - name: data
          emptyDir: {}
