name: brewtrack_web
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.11.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: BigShouldersStencil
      fonts:
        - asset: assets/fonts/BigShouldersStencil-Variable.ttf
    - family: PublicSans
      fonts:
        - asset: assets/fonts/PublicSans-Variable.ttf
    # Roboto apunta a Public Sans: así Flutter no descarga Roboto de fonts.gstatic.com.
    - family: Roboto
      fonts:
        - asset: assets/fonts/PublicSans-Variable.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
