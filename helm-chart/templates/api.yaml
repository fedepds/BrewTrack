apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "brewtrack.labels" (list . "api") | nindent 4 }}
spec:
  selector:
    {{- include "brewtrack.selector" (list . "api") | nindent 4 }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "brewtrack.labels" (list . "api") | nindent 4 }}
spec:
  # ponytail: 1 réplica fija; con más, cada una corre "alembic upgrade head" al arrancar. Pasar las migraciones a un Job antes de escalar.
  replicas: 1
  selector:
    matchLabels:
      {{- include "brewtrack.selector" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "brewtrack.labels" (list . "api") | nindent 8 }}
    spec:
      # uid numérico: con "USER app" el kubelet no puede comprobar runAsNonRoot.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "brewtrack.secretName" . }}
                  key: POSTGRES_PASSWORD
            # $(VAR) usa una variable definida más arriba en esta lista.
            - name: DATABASE_URL
              value: postgresql+psycopg://brewtrack:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-db:{{ .Values.db.service.port }}/brewtrack
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "brewtrack.secretName" . }}
                  key: JWT_SECRET
            # Primer admin: solo si el Secret trae estas claves.
            - name: SEED_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ include "brewtrack.secretName" . }}
                  key: SEED_ADMIN_EMAIL
                  optional: true
            - name: SEED_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "brewtrack.secretName" . }}
                  key: SEED_ADMIN_PASSWORD
                  optional: true
          ports:
            - containerPort: 8000
          # Si db no está lista, la API falla y Kubernetes la reinicia hasta que conecta.
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
