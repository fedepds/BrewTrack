
apiVersion: v1
kind: Namespace
metadata:
  name: brewtrack
---

apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: brewtrack
spec:
  selector:
    app: db
  ports:
    - port: 5432
---
# StatefulSet: como un Deployment, pero cada pod conserva su disco al reiniciarse.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: brewtrack
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: brewtrack
            - name: POSTGRES_DB
              value: brewtrack
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: brewtrack
                  key: POSTGRES_PASSWORD
            # Subcarpeta: algunos discos traen "lost+found" en la raíz y Postgres no arranca.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          # Equivale al healthcheck de compose: hasta que responda, no recibe tráfico.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "brewtrack"]
            periodSeconds: 5
  # Pide un disco de 1 GiB al clúster (el "volumes: pgdata" de compose).
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: brewtrack
spec:
  selector:
    app: api
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: brewtrack
spec:
  # ponytail: 1 réplica; con más, cada una corre "alembic upgrade head" al arrancar. Pasar las migraciones a un Job antes de escalar.
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: localhost/brewtrack-api:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: brewtrack
                  key: POSTGRES_PASSWORD
            # $(VAR) usa una variable definida más arriba en esta lista.
            - name: DATABASE_URL
              value: postgresql+psycopg://brewtrack:$(POSTGRES_PASSWORD)@db:5432/brewtrack
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: brewtrack
                  key: JWT_SECRET
            - name: TIMEZONE
              value: America/Argentina/Buenos_Aires
            - name: SEED_DEMO_LOTS
              value: "true"
          ports:
            - containerPort: 8000
          # No hay depends_on: si db no está lista, la API falla y Kubernetes la reinicia hasta que conecta.
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            periodSeconds: 10
