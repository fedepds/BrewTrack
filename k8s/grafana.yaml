# Grafana con Prometheus como fuente y un dashboard de la API. La clave de admin va en el Secret "grafana" (ver README).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: brewtrack
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus:9090
        isDefault: true
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: brewtrack
        type: file
        options:
          path: /var/lib/grafana-dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: brewtrack
data:
  brewtrack.json: |
    {
      "uid": "brewtrack-api",
      "title": "BrewTrack — API",
      "schemaVersion": 39,
      "refresh": "15s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "stat", "title": "API arriba",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "targets": [ { "refId": "A", "expr": "up{job=\"api\"}" } ],
          "fieldConfig": { "defaults": {
            "mappings": [ { "type": "value", "options": { "0": { "text": "Caída", "color": "red" }, "1": { "text": "OK", "color": "green" } } } ],
            "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] }
          } }
        },
        {
          "id": 2, "type": "stat", "title": "Pedidos por segundo",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "targets": [ { "refId": "A", "expr": "sum(rate(http_requests_total[5m]))" } ],
          "fieldConfig": { "defaults": { "unit": "reqps", "decimals": 2 } }
        },
        {
          "id": 3, "type": "stat", "title": "Errores 5xx (5 min)",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "targets": [ { "refId": "A", "expr": "sum(increase(http_requests_total{status=\"5xx\"}[5m])) or vector(0)" } ],
          "fieldConfig": { "defaults": { "decimals": 0,
            "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } } }
        },
        {
          "id": 4, "type": "stat", "title": "Logins fallidos (5 min)",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "targets": [ { "refId": "A", "expr": "sum(increase(http_requests_total{handler=\"/api/v1/auth/login\",status=\"4xx\"}[5m])) or vector(0)" } ],
          "fieldConfig": { "defaults": { "decimals": 0,
            "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "orange", "value": 5 }, { "color": "red", "value": 10 } ] } } }
        },
        {
          "id": 5, "type": "timeseries", "title": "Pedidos por segundo, por ruta",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 9 },
          "targets": [ { "refId": "A", "expr": "sum by (method, handler) (rate(http_requests_total[5m]))", "legendFormat": "{{method}} {{handler}}" } ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 6, "type": "timeseries", "title": "Pedidos por segundo, por código",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 9 },
          "targets": [ { "refId": "A", "expr": "sum by (status) (rate(http_requests_total[5m]))", "legendFormat": "{{status}}" } ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 7, "type": "timeseries", "title": "Latencia p95, por ruta",
          "gridPos": { "x": 0, "y": 13, "w": 24, "h": 9 },
          "targets": [ { "refId": "A", "expr": "histogram_quantile(0.95, sum by (le, handler) (rate(http_request_duration_seconds_bucket[5m])))", "legendFormat": "{{handler}}" } ],
          "fieldConfig": { "defaults": { "unit": "s" } }
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: brewtrack
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: brewtrack
spec:
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:12.4.13
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana
                  key: admin-password
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
            - name: dashboards
              mountPath: /var/lib/grafana-dashboards
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          emptyDir: {}
