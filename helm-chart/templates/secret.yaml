# Claves al azar en cada render: nada queda en Git.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "brewtrack.labels" (list . "secrets") | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ randAlphaNum 32 | b64enc | quote }}
  JWT_SECRET: {{ randAlphaNum 64 | b64enc | quote }}
