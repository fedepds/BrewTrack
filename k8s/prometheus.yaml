apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: brewtrack
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      # ponytail: destino fijo al Service (1 réplica). Con varias réplicas, pasar a kubernetes_sd_configs con ServiceAccount y RBAC.
      - job_name: api
        static_configs:
          - targets: ["api:8000"]
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: brewtrack
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: brewtrack
spec:
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v3.15.1
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus
        - name: data
          emptyDir: {}
