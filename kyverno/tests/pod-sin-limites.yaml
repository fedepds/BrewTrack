# Incumple 02: sin resources.
apiVersion: v1
kind: Pod
metadata:
  name: kyverno-sin-limites
  namespace: brewtrack
  labels:
    app: kyverno-test
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: docker.io/library/busybox:1.37.0
    command:
    - sleep
    - '3600'
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
