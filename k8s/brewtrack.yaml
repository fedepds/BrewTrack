# Manifiestos de BrewTrack para Minikube. El Secret "brewtrack-secrets" no vive aquí: ver k8s/README.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: brewtrack-pgdata
  namespace: brewtrack
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: brewtrack
spec:
  replicas: 1
  strategy:
    type: Recreate   # nunca dos instancias sobre el mismo volumen
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
        - name: db
          image: docker.io/library/postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - {name: POSTGRES_USER, value: brewtrack}
            - {name: POSTGRES_DB, value: brewtrack}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: brewtrack-secrets, key: POSTGRES_PASSWORD}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "brewtrack"]
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: brewtrack-pgdata}
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: brewtrack
spec:
  selector: {app: db}
  ports:
    - {port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: brewtrack
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: localhost/brewtrack-api:0.1.0
          imagePullPolicy: Never   # la imagen viene de "minikube image load"
          ports:
            - containerPort: 8000
          env:
            # POSTGRES_PASSWORD va antes: Kubernetes solo expande $(VAR) de variables ya definidas.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: brewtrack-secrets, key: POSTGRES_PASSWORD}
            - name: DATABASE_URL
              value: postgresql+psycopg://brewtrack:$(POSTGRES_PASSWORD)@db:5432/brewtrack
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: brewtrack-secrets, key: JWT_SECRET}
            - {name: TIMEZONE, value: America/Argentina/Buenos_Aires}
            - {name: SEED_DEMO_LOTS, value: "true"}
          readinessProbe:
            httpGet: {path: /api/v1/health, port: 8000}
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: brewtrack
spec:
  selector: {app: api}
  ports:
    - {port: 8000, targetPort: 8000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: brewtrack
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: localhost/brewtrack-web:0.1.1
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            - {name: API_HOST, value: api.brewtrack.svc.cluster.local}
          readinessProbe:
            httpGet: {path: /, port: 80}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: brewtrack
spec:
  selector: {app: web}
  ports:
    - {port: 80, targetPort: 80}
