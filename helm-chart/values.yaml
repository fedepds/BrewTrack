# Valores por defecto: sirven en minikube con las imágenes cargadas a mano.
# Las claves no van aquí: la chart las genera al instalar.
# Nombre de un Secret propio con las mismas claves que <release>-secrets y, si
# quieres, las del primer admin (SEED_ADMIN_*). Vacío: la chart crea el suyo.
existingSecret: ""
db:
  image: { repository: localhost/brewtrack-db, tag: "0.1.0", pullPolicy: IfNotPresent }
  service: { type: ClusterIP, port: 5432 }
  resources: {}
  # storageClass vacío: usa la clase por defecto del clúster.
  persistence: { size: 1Gi, storageClass: "" }

api:
  image: { repository: localhost/brewtrack-api, tag: "0.1.0", pullPolicy: IfNotPresent }
  # La plantilla fija 1 réplica, diga lo que diga este valor: ver templates/api.yaml.
  replicas: 1
  service: { type: ClusterIP, port: 8000 }
  resources: {}
  config: { timezone: America/Argentina/Buenos_Aires, seedDemoLots: "true" }

web:
  image: { repository: localhost/brewtrack-web, tag: "0.1.0", pullPolicy: IfNotPresent }
  replicas: 1
  service: { type: ClusterIP, port: 8080 }
  resources: {}

# Apagado: hace falta un controlador de Ingress en el clúster.
# className vacío: usa la clase por defecto del clúster.
ingress: { enabled: false, className: "", host: brewtrack.local, annotations: {} }
