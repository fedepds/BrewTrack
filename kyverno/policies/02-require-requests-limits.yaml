apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: brewtrack-require-requests-limits
  annotations:
    policies.kyverno.io/title: Exigir requests y límites de CPU y memoria
    policies.kyverno.io/category: BrewTrack
    policies.kyverno.io/severity: medium
    policies.kyverno.io/minversion: 1.19.1
    policies.kyverno.io/description: >-
      Cada contenedor tiene que declarar requests y limits de CPU y de memoria. Sin límites, un pod puede quedarse con toda la memoria del nodo y tirar a los demás.
spec:
  # Deny: el API server rechaza el recurso. Audit solo lo anotaría en un PolicyReport.
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    # Todo el clúster salvo los namespaces del sistema y de las herramientas que necesitan privilegios (Falco).
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, kyverno, falco, ingress-nginx]
    # Pods y todo lo que crea pods: así Helm recibe el rechazo al crear el Deployment, no después.
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, replicationcontrollers]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets, replicasets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
  variables:
    # La especificación del pod, esté donde esté según el tipo de recurso.
    - name: podSpec
      expression: >-
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        (has(object.spec.template) ? object.spec.template.spec : object.spec)
    - name: containers
      expression: >-
        variables.podSpec.containers +
        (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : [])
  validations:
    - expression: >-
        variables.containers.all(c,
          has(c.resources) &&
          has(c.resources.requests) && has(c.resources.requests.cpu) && has(c.resources.requests.memory) &&
          has(c.resources.limits) && has(c.resources.limits.cpu) && has(c.resources.limits.memory))
      message: "Cada contenedor necesita resources.requests y resources.limits de cpu y memory."
